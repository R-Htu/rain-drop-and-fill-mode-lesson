<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rain Animation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fall {
      0% {
        transform: translateY(-100%);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    .raindrop {
      position: absolute;
      background-color: #60a5fa;
      border-radius: 9999px;
      opacity: 0.75;
      width: 2px;
      height: 15px;
      animation-name: fall;
      animation-timing-function: linear;
      animation-fill-mode: both;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-gray-900 via-black to-gray-900 min-h-screen flex items-center justify-center text-white relative overflow-hidden">

  <!-- Rain Effect -->
  <div id="rain" class="fixed inset-0 pointer-events-none z-10"></div>

  <!-- Content -->
  <div class="relative z-20 text-center p-8 bg-black bg-opacity-50 backdrop-blur-md rounded-2xl shadow-xl max-w-lg w-full">
    <h1 class="text-3xl font-bold text-blue-300 mb-6 drop-shadow">🌧️ Rain Animation Lesson</h1>

    <div class="flex flex-col gap-4">
      <a href="animation-fill-mode.html" target="_blank" class="text-pink-300 underline hover:text-pink-500 transition duration-300 hover:scale-105">
        ▶ Animation Fill Mode Lesson
      </a>
      <a href="backwards-both.html" target="_blank" class="text-yellow-300 underline hover:text-yellow-500 transition duration-300 hover:scale-105">
        ▶ Backward and Both Mode Lesson
      </a>
      <a href="timing-functions-lesson.html" target="_blank" class="text-green-300 underline hover:text-green-500 transition duration-300 hover:scale-105">
        ▶ Timing Functions Lesson
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const rainContainer = document.getElementById('rain');

      function createRaindrop() {
        const drop = document.createElement('div');
        drop.classList.add('raindrop');
        drop.style.left = Math.random() * window.innerWidth + 'px';
        drop.style.top = '0px';
        drop.style.animationDuration = (Math.random() * 0.5 + 0.7) + 's';
        drop.style.animationDelay = (Math.random() * 2) + 's';

        rainContainer.appendChild(drop);
        drop.addEventListener('animationend', () => drop.remove());
      }

      setInterval(createRaindrop, 30);
    });
  </script>
</body>
</html>
